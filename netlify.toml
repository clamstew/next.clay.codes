[build]
  command = "pnpm build"
  publish = "build/client"
  functions = "netlify/functions"

[dev]
  command = "pnpm dev"
  port = 3000

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Remove the redirects section if using edge functions 

[[edge_functions]]
  function = "remix-server"
  path = "/*"

[build.processing.ignore]
  files = ["build/server/**"] 